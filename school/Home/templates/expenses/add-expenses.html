{% extends "Home/base.html" %}

{% load static %}

{% block body %}

<div class="page-wrapper">
<div class="content container-fluid">

<div class="page-header">
<div class="row align-items-center">
<div class="col">
<h3 class="page-title">Add Expenses</h3>
<ul class="breadcrumb">
<li class="breadcrumb-item"><a href="{% url "expenses_list" %}">Accounts</a></li>
<li class="breadcrumb-item active">Add Expenses</li>
</ul>
</div>
</div>
</div>

<div class="row">
<div class="col-sm-12">
<div class="card">
<div class="card-body">
<form method="POST" enctype = "multipart/form-data">
    {% csrf_token %}
<div class="row">
<div class="col-12">
<h5 class="form-title"><span>Expense Information</span></h5>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Expenses ID</label>
<input type="text" class="form-control" name="expenses_id" required>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Item Name</label>
<input type="text" class="form-control" name="item_name" required>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Item Quality</label>
<select class="form-control" name="item_quality" required>
   <option value="Low">Low</option>
 <option value="Medium">Medium</option>
 <option value="High">High</option>
   </select>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Expense Amount</label>
<input type="number" class="form-control" name="expense_amount" required>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Source of Purchase</label>
<input type="text" class="form-control" name="source_of_purchase" required>
</div>
</div>
<div class="col-12">
<button type="submit" class="btn btn-primary">Submit</button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
</div>

</div>


<script src="{%static 'assets/js/jquery-3.6.0.min.js' %}"></script>

<script src="{%static 'assets/js/popper.min.js' %}"></script>
<script src="{%static 'assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>

<script src="{%static 'assets/plugins/slimscroll/jquery.slimscroll.min.js' %}"></script>

<script src="{%static 'assets/js/script.js' %}"></script>
</body>

</html>
{% endblock  %}
