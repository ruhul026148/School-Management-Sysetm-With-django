{% extends "Home/base.html" %}

{% load static %}

{% block body %}

<div class="page-wrapper">
<div class="content container-fluid">

<div class="page-header">
<div class="row align-items-center">
<div class="col">
<h3 class="page-title">Add Fees</h3>
<ul class="breadcrumb">
<li class="breadcrumb-item"><a href="{% url "fees_list" %}">Fees</a></li>
<li class="breadcrumb-item active">Add Fees</li>
</ul>
</div>
</div>
</div>

<div class="row">
<div class="col-sm-12">
<div class="card">
<div class="card-body">
<form method="POST" enctype = "multipart/form-data">
        {% csrf_token %}
<div class="row">
<div class="col-12">
<h5 class="form-title"><span>Fees Information</span></h5>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Fees ID</label>
<input type="text" class="form-control" name="fees_id" required>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Fees Type</label>
<select class="form-control" name="fees_type" required>
<option value="">Select Type</option>
<option value="Monthly Fees">Monthly Fees</option>
<option value="Admission Fees">Admission Fees</option>
<option value="Class Test">Class Test</option>
<option value="Exam Fees">Exam Fees</option>
<option value="Hostel Fees">Hostel Fees</option>
<option value="Others">Others</option>
</select>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Class</label>
<select class="form-control" name="student_class" required>
<option>Select Class</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>
</select>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Fees Amount</label>
<input type="number" class="form-control" name="fees_amount" required>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Start Date</label>
<input type="date" class="form-control" name="start_date" required>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>End Date</label>
<input type="date" class="form-control" name="end_date" required>
</div>
</div>
<div class="col-12">
<button type="submit" class="btn btn-primary">Submit</button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
</div>

</div>


<script src="{%static 'assets/js/jquery-3.6.0.min.js' %}"></script>

<script src="{%static 'assets/js/popper.min.js' %}"></script>
<script src="{%static 'assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>

<script src="{%static 'assets/plugins/slimscroll/jquery.slimscroll.min.js' %}"></script>

<script src="{%static 'assets/js/script.js' %}"></script>
</body>

<!-- Mirrored from preschool.dreamguystech.com/html-template/add-fees.html by HTTrack Website Copier/3.x [XR&CO'2014], Thu, 28 Oct 2021 11:12:21 GMT -->
</html>
{% endblock  %}
