{% extends "Home/base.html" %}

{% load static %}
{% block body %}
<div class="page-wrapper">
<div class="content container-fluid">

<div class="page-header">
<div class="row align-items-center">
<div class="col">
<h3 class="page-title">Edit Teachers</h3>
<ul class="breadcrumb">
<li class="breadcrumb-item"><a href="/teachers">Teachers</a></li>
<li class="breadcrumb-item active">Edit Teachers</li>
</ul>
</div>
</div>
</div>

<div class="row">
<div class="col-sm-12">
<div class="card">
<div class="card-body">
<form method="POST" enctype = "multipart/form-data">
    {% csrf_token %}
    <div class="row">
        <div class="col-12">
<h5 class="form-title"><span>Basic Details</span></h5>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Teacher ID</label>
<input type="text" name="teacher_id" class="form-control" value="{{teacher.teacher_id}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Name</label>
<input type="text" name="name" class="form-control" value="{{teacher.name}}">
</div>
</div>
<div class="col-12 col-sm-6">
                                    <div class="form-group">
                                       <label>Student Image</label>
                                       <input type="file" name="teacher_image" class="form-control" value={{teacher.teacher_image}}>
                                       {% if teacher.teacher_image %}
                                       <img src="{{teacher.teacher_image.url}}" width="50px" alt="">
                                       {% else %}
                                       No Image
                                       {% endif %}
                                    </div>
                                 </div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Gender</label>
<select name="gender" class="form-control">
    <option value="">Select Gender</option>
    <option value="Male" {% if teacher.gender == 'Male' %}selected{% endif %}>Male</option>
    <option value="Female" {% if teacher.gender == 'Female' %}selected{% endif %}>Female</option>
    <option value="Others" {% if teacher.gender == 'Others' %}selected{% endif %}>Others</option>
</select>
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Date of Birth</label>
<input type="date" name="date_of_birth" class="form-control" value="{{teacher.date_of_birth}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Mobile</label>
<input type="text" name="mobile" class="form-control" value="{{teacher.mobile}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Joining Date</label>
<input type="date" name="joining_date" class="form-control" value="{{teacher.joining_date}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Qualification</label>
<input class="form-control" type="text" name="qualification" value="{{techer.qualification}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Experience</label>
<input class="form-control" type="text" name="experience" value="{{teacher.experience}}">
</div>
</div>
<div class="col-12">
<h5 class="form-title"><span>Login Details</span></h5>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Username</label>
<input type="text" name="username" class="form-control" value="{{teacher.username}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Email ID</label>
<input type="email" name="email" class="form-control" value="{{teacher.email}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Password</label>
<input type="password" name="password" class="form-control" value="{{teacher.password}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Repeat Password</label>
<input type="password" name="password" class="form-control" value="{{teacher.password}}">
</div>
</div>
<div class="col-12">
<h5 class="form-title"><span>Address</span></h5>
</div>
<div class="col-12">
<div class="form-group">
<label>Address</label>
<input type="text" name="address" class="form-control" value="{{teacher.address}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>City</label>
<input type="text" name="city" class="form-control" value="{{teacher.city}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>State</label>
<input type="text" name="state" class="form-control" value="{{teacher.state}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Zip Code</label>
<input type="text" name="zip_code" class="form-control" value="{{teacher.zip_code}}">
</div>
</div>
<div class="col-12 col-sm-6">
<div class="form-group">
<label>Country</label>
<input type="text" name="country" class="form-control" value="{{teacher.country}}">
</div>
</div>
<div class="col-12">
<button type="submit" class="btn btn-primary">Submit</button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
</div>

</div>


<script src="{%static 'assets/js/jquery-3.6.0.min.js' %}"></script>

<script src="{%static 'assets/js/popper.min.js' %}"></script>
<script src="{%static 'assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>

<script src="{%static 'assets/plugins/slimscroll/jquery.slimscroll.min.js' %}"></script>

<script src="{%static 'assets/js/script.js' %}"></script>
</body>

<!-- Mirrored from preschool.dreamguystech.com/html-template/edit-teacher.html by HTTrack Website Copier/3.x [XR&CO'2014], Thu, 28 Oct 2021 11:11:50 GMT -->
</html>
{% endblock  %}
